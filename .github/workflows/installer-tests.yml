name: Wyrd tests and release bundle

on:
  push:
    branches: [stl-steam]
  pull_request:
    branches: [stl-steam]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt dependencies
        run: python -m pip install -r qt-ui/requirements.txt
      - name: Shell syntax and Python compile checks
        run: |
          bash -n install-skyrim-stl.sh
          bash -n tests/test-install-skyrim-stl.sh
          bash -n misc/stl-ui.sh
          bash -n tests/test-stl-ui.sh
          python3 -m compileall -q qt-ui
      - name: Python unit tests
        run: python3 -m unittest discover -s qt-ui/tests -p 'test_*.py'
      - name: Qt offscreen smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s qt-ui/tests -p 'test_main_window.py'
      - name: Installer integration tests
        run: bash tests/test-install-skyrim-stl.sh
      - name: Terminal UI wrapper tests
        run: bash tests/test-stl-ui.sh

  release-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source release bundle
        run: |
          bundle="$RUNNER_TEMP/wyrd-qt6-source.tar.gz"
          tar --exclude=.git --exclude=qt-ui/.venv --exclude='*/__pycache__' --exclude=./dist --exclude=./dist/ -czf "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: wyrd-qt6-source
          path: ${{ runner.temp }}/wyrd-qt6-source.tar.gz
          if-no-files-found: error
